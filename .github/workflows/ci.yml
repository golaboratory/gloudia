name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

# GITHUB_TOKEN は既定で広い権限を持つため、ジョブに必要な最小権限へ絞る。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Verify module checksums
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run tests (race detector + coverage)
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # go.mod の Go バージョン (1.25) をパースできるビルドを明示的に固定する。
          # 'latest' は action のバージョンに紐づく古いビルドを引くことがある。
          version: v2.12.2

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # gitleaks が差分だけでなく全履歴を走査できるようにする。
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
